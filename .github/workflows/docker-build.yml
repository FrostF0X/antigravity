name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ] # Triggers on version tags like v1.0.1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: # Required for pushing to GHCR
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 1. Set up Docker Buildx (allows for multi-platform & caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Extract metadata (tags, labels) for Docker
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            # docker.io/${{ secrets.DOCKERHUB_USERNAME }}/my-app-name

      # 4. Build and push the image
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # platforms: linux/amd64,linux/arm64 # Uncomment for multi-arch support
          cache-from: type=gha # Uses GitHub Actions cache for faster builds
          cache-to: type=gha,mode=max
